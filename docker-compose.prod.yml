version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: notetime-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notetime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-notetime}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-notetime}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - notetime-network

  # Notetime Application
  web:
    build: .
    container_name: notetime-app-prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-notetime}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-notetime}
      ENVIRONMENT: production
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - notetime-network
    # No volumes mounted in production for security
    command: uvicorn notetime.main:app --host 0.0.0.0 --port 8000 --workers 4

networks:
  notetime-network:
    driver: bridge

volumes:
  postgres_data:
