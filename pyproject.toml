[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
# Exclude scripts directory from test collection
norecursedirs = ["scripts", ".git", "__pycache__", "*.egg-info"]
