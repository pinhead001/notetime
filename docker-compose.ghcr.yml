services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: notetime-db
    environment:
      POSTGRES_USER: notetime
      POSTGRES_PASSWORD: notetime
      POSTGRES_DB: notetime
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notetime"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Notetime Application - using published image
  web:
    image: ghcr.io/pinhead001/notetime:latest
    container_name: notetime-app
    environment:
      DATABASE_URL: postgresql://notetime:notetime@db:5432/notetime
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
