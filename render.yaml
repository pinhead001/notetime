services:
  - type: web
    name: notetime
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn notetime.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: notetime-db
          property: connectionString
      - key: ENVIRONMENT
        value: production

databases:
  - name: notetime-db
    databaseName: notetime
    user: notetime

    